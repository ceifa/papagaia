name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libasound2-dev meson ninja-build libwayland-dev gobject-introspection libgirepository1.0-dev valac
      # gtk4-layer-shell isn't packaged on the runner, so it's built from source.
      # The install prefix is cached keyed on the pinned version, so the meson/ninja
      # compile only runs on a cache miss (version bump).
      - name: Cache gtk4-layer-shell
        id: gtk4ls
        uses: actions/cache@v4
        with:
          path: ~/gtk4ls
          key: gtk4ls-1.3.0-${{ runner.os }}
      - name: Build gtk4-layer-shell from source
        if: steps.gtk4ls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup --prefix="$HOME/gtk4ls" --libdir=lib -Dexamples=false -Ddocs=false -Dtests=false build
          ninja -C build
          ninja -C build install
      - name: Expose gtk4-layer-shell to the build
        run: |
          echo "PKG_CONFIG_PATH=$HOME/gtk4ls/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/gtk4ls/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
