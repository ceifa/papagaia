name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # This job never compiles the Rust workspace (only `cargo generate-lockfile`
      # below), so it needs no GTK/ALSA system deps or gtk4-layer-shell build.
      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo generate-lockfile

      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
          fi
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
          fi
          git push origin HEAD:main
          git push origin "v$VERSION"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --generate-notes
          fi

  aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          echo -e "Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur" >> ~/.ssh/config

      - name: Update AUR package
        run: |
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/v$VERSION.tar.gz"

          # Wait for the tarball to become available
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$TARBALL_URL")
            [ "$HTTP_CODE" = "200" ] && break
            sleep 5
          done

          SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | awk '{print $1}')

          git clone ssh://aur@aur.archlinux.org/papagaia.git aur-pkg
          cd aur-pkg

          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s|sha256sums=('[^']*'|sha256sums=('${SHA256}'|" PKGBUILD

          # Generate .SRCINFO in Arch container (makepkg refuses to run as root)
          docker run --rm -v "$(pwd):/pkg" archlinux:base-devel bash -c "
            useradd -m builder && chown -R builder:builder /pkg &&
            su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to $VERSION"
            git push
          fi
