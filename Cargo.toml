[workspace]
members = [
    "crates/papagaia-core",
    "crates/papagaia-daemon",
    "crates/papagaia-cli",
    "crates/papagaia-overlay",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["ceifa"]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
libc = "0.2.186"
tokio = { version = "1.52.3", features = ["macros", "rt", "net", "io-util", "process", "sync", "time", "signal"] }
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }

[profile.release]
# A long-running desktop daemon: trade build time for a faster, smaller binary.
# LTO + single codegen unit let the optimizer inline across crates; strip drops
# debug symbols that would otherwise bloat the shipped binaries.
lto = true
codegen-units = 1
strip = true
panic = "abort"
