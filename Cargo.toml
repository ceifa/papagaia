[workspace]
members = [
    "crates/papagaia-core",
    "crates/papagaia-daemon",
    "crates/papagaia-cli",
    "crates/papagaia-overlay",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["ceifa"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2.191"
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util", "fs", "process", "sync", "time", "signal"] }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde"] }

[profile.release]
# A long-running desktop daemon: trade build time for a faster, smaller binary.
# LTO + single codegen unit let the optimizer inline across crates; strip drops
# debug symbols that would otherwise bloat the shipped binaries.
lto = true
codegen-units = 1
strip = true
panic = "abort"
